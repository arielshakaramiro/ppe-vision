name: Pemeriksaan otomatis

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pemeriksaan-repositori:
    name: Diff dan Compose
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Periksa whitespace commit
        run: git diff --check HEAD^ HEAD
      - name: Validasi konfigurasi Compose
        run: |
          cp .env.example .env
          docker compose --env-file .env -f deploy/docker-compose.prod.yml config --quiet

  backend:
    name: Test backend
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4
      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-dev.lock
      - name: Pasang dependensi
        run: |
          python -m pip install torch==2.14.1 torchvision==0.29.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r backend/requirements.lock -r backend/requirements-dev.lock
          python -m pip check
      - name: Jalankan test
        working-directory: backend
        run: python -m pytest -q

  frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4
      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Pasang dependensi
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  playwright:
    name: Test E2E Chromium
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4
      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-dev.lock
      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Pasang dependensi backend E2E
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install torch==2.14.1 torchvision==0.29.1 --index-url https://download.pytorch.org/whl/cpu
          backend/.venv/bin/python -m pip install -r backend/requirements.lock -r backend/requirements-dev.lock
          backend/.venv/bin/python -m pip check
      - name: Pasang dependensi frontend
        working-directory: frontend
        run: npm ci
      - name: Pulihkan cache Chromium Playwright
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('frontend/package-lock.json') }}
      - name: Pasang Chromium Playwright
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install chromium
      - name: Pasang dependensi sistem Chromium
        working-directory: frontend
        run: npx playwright install-deps chromium
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Jalankan test E2E
        working-directory: frontend
        run: npx playwright test --project=chromium
      - name: Unggah laporan dan diagnostik Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-chromium
          path: |
            frontend/playwright-report/
            frontend/e2e/.results/
          if-no-files-found: warn
          retention-days: 14